# Draft release recipe from the MATH N32/K8 experiment launcher.
# Historical paper/checkpoint reproduction has not been verified.
model_path: GSAI-ML/LLaDA-8B-Instruct
use_peft: true
load_in_4bit: true
compute_dtype: bfloat16
torch_dtype: bfloat16
lora_r: 128
lora_alpha: 64
lora_dropout: 0.05
peft_task_type: CAUSAL_LM
dataset: math
seed: 42
bf16: true
sync_ref_model: false
adam_beta1: 0.9
adam_beta2: 0.99
weight_decay: 0.1
max_grad_norm: 0.2
warmup_ratio: 0.0001
learning_rate: 3.0e-6
lr_scheduler_type: constant_with_warmup
num_generations: 4
num_train_epochs: 10
per_device_train_batch_size: 1
per_device_eval_batch_size: 4
gradient_accumulation_steps: 4
gradient_checkpointing: false
resume_from_checkpoint: null
run_name: map_math_n32_k8
output_dir: checkpoints/math
report_to: none
logging_steps: 1
save_steps: 100
save_strategy: steps
save_total_limit: 100
max_completion_length: 256
max_prompt_length: 200
block_length: 32
diffusion_steps: 128
generation_batch_size: 6
temperature: 0.9
remasking: low_confidence
random_masking: true
p_mask_prompt: 0.15
beta: 0.0
num_iterations: 12
advantage_estimator: rloo
loss_type: gspo
clip_eps_low: 0.0003
clip_eps_high: 0.0004
averaging_mode: token_level
use_stepmerge: true
num_stepmerge_blocks: 32
stepmerge_sample_k_blocks: 8
stepmerge_blocks_per_microbatch: 1
use_position_likelihood: true
position_likelihood_method: softmax
position_likelihood_scope: segment
position_likelihood_confidence: max_logit
position_likelihood_temperature: 1.0
position_likelihood_lambda: 1.0
position_confidence_source: gt
position_mask_token_clipped: false
position_loss_type: gspo
position_clip_eps_low: 0.0003
position_clip_eps_high: 0.0004
position_averaging_mode: token_level
# These match the inspected launcher; paper stochastic sampling is not asserted.
decouple_position_token_sampling: false
stochastic_position_selection: false
position_sampling_temperature: 0.0
